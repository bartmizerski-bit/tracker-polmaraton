<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Test minutnika systemowego</title>
<style>
  body { margin: 0; padding: 1rem; background: #0d0d1a; color: #f4f4f4;
         font-family: system-ui, sans-serif; max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.2rem; }
  p { color: #9a9aa8; font-size: 0.9rem; }
  a.btn { display: block; margin: 0.6rem 0; padding: 0.8rem; border-radius: 10px;
          background: #16162a; border: 1.5px solid #b6ff3c; color: #b6ff3c;
          text-decoration: none; font-weight: 600; }
  a.btn small { display: block; color: #9a9aa8; font-weight: 400; margin-top: 0.2rem; }
  #wynik { padding: 0.8rem; border-radius: 10px; background: #d81e2c; display: none; }
</style>
</head>
<body>
<h1>Test minutnika systemowego (Android)</h1>
<p>Klikaj po kolei. Jeśli przeglądarka nie znajdzie aplikacji Zegar,
wróci tutaj i pokaże czerwony komunikat z literą wariantu.</p>
<div id="wynik"></div>
<div id="lista"></div>

<script>
  const LEN = 90;
  const extras =
    "i.android.intent.extra.alarm.LENGTH=" + LEN + ";" +
    "S.android.intent.extra.alarm.MESSAGE=Przerwa;";

  const warianty = [
    { id: "A", opis: "SET_TIMER, start bez otwierania Zegara (SKIP_UI)",
      intent: "action=android.intent.action.SET_TIMER;" + extras + "B.android.intent.extra.alarm.SKIP_UI=true;" },
    { id: "B", opis: "SET_TIMER, z otwarciem Zegara",
      intent: "action=android.intent.action.SET_TIMER;" + extras },
    { id: "C", opis: "SET_TIMER wprost do Zegara Google",
      intent: "action=android.intent.action.SET_TIMER;package=com.google.android.deskclock;" + extras + "B.android.intent.extra.alarm.SKIP_UI=true;" },
    { id: "D", opis: "SET_TIMER wprost do Zegara Samsung",
      intent: "action=android.intent.action.SET_TIMER;package=com.sec.android.app.clockpackage;" + extras + "B.android.intent.extra.alarm.SKIP_UI=true;" },
    { id: "E", opis: "Kontrolnie: tylko otwórz listę minutników",
      intent: "action=android.intent.action.SHOW_TIMERS;" },
  ];

  const baza = location.href.split("?")[0];
  const lista = document.getElementById("lista");

  warianty.forEach((w) => {
    const fallback = encodeURIComponent(baza + "?nieudany=" + w.id);
    const a = document.createElement("a");
    a.className = "btn";
    a.href = "intent:#Intent;" + w.intent + "S.browser_fallback_url=" + fallback + ";end";
    a.innerHTML = "Wariant " + w.id + "<small>" + w.opis + "</small>";
    lista.appendChild(a);
  });

  const nieudany = new URLSearchParams(location.search).get("nieudany");
  if (nieudany) {
    const el = document.getElementById("wynik");
    el.textContent = "Wariant " + nieudany + ": przeglądarka nie uruchomiła Zegara.";
    el.style.display = "block";
  }
</script>
</body>
</html>
